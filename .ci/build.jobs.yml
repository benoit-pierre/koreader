# Sets. {{{

# Default jobs to run.
default: &DEFAULT [
  # emulator
  # emu-gcc,
  # macos
  # macos-arm64,
  # others
  linux-x86_64,
  # android-arm,
  # android-arm64,
  # kindlepw2,
]

# Extra jobs when on master.
master: [
  *DEFAULT,
  emu-clang,
  macos-x86_64,
]

# Release.
release: [
  # macos
  macos-.*,
  # others
  linux-*,
  android-.*,
  cervantes,
  kindle.*,
  kobo.*,
  pocketbook.*,
  remarkable.*,
]

# }}}

# Jobs. {{{

emulator: # {{{

  - id: emu-clang
    job: Clang
    image: koreader/kobase-clang:3.0.0-22.04
    target: ""
    makeflags: PARALLEL_JOBS=5 KODEBUG= USE_CLANG=1
    test: true

  - &EMU_GCC
    id: emu-gcc
    job: GCC
    image: koreader/kobase:3.0.0-22.04
    target: ""
    makeflags: PARALLEL_JOBS=5 KODEBUG=
    cache_size: 240M
    test: true

  - <<: *EMU_GCC
    id: emu-gcc-debug
    job: GCC Debug
    makeflags: PARALLEL_JOBS=5 KODEBUG=1

# }}}

macos: # {{{

  - &MACOS
    id: macos-arm64
    job: "macOS 15 ARM64 🔨16.4 🎯11.0"
    cache: macos.15_ARM64_xcode.16.4_11.0
    runs-on: macos-15
    xcode_version: "16.4"
    macosx_deployment_target: "11.0"
    makeflags: PARALLEL_JOBS=4
    cache_size: 256MB
    target: macos
    test: true
    artifacts: koreader-*.7z

  - <<: *MACOS
    id: macos-x86_64
    job: "macOS 15 x86-64 🔨16.4 🎯10.15"
    cache: macos.15_x86_64_xcode.16.4_10.15
    runs-on: macos-15-intel
    macosx_deployment_target: "10.15"
    makeflags: PARALLEL_JOBS=5

# }}}

platform:

  # android {{{

  - &ANDROID
    id: android-arm
    job: Android ARM
    image: koreader/koandroid:3.0.0-22.04
    makeflags: PARALLEL_JOBS=5
    cache_size: 260M
    artifacts: koreader-*.apk

  - <<: *ANDROID
    id: android-arm64
    job: Android ARM64

  - <<: *ANDROID
    id: android-x86
    job: Android x86

  - <<: *ANDROID
    id: android-x86_64
    job: Android x86_64

  # }}}

  # linux {{{

  - &LINUX
    id: linux-aarch64
    job: Linux AArch64
    runs-on: ubuntu-24.04-arm
    image: koreader/koappimage:3.0.0-22.04
    target: linux
    makeflags: PARALLEL_JOBS=5
    cache_size: 415M
    test: true
    update_target: update-appimage
    artifacts: koreader-*.AppImage

  # FIXME: does not work, no support for using a docker image with
  # the `--platform=…` docker argument (see `build.matrix.yml`)…
  # - <<: *LINUX
  #   id: linux-armhf
  #   job: Linux ARMhf
  #   platform: aarch64

  - <<: *LINUX
    id: linux-x86_64
    job: Linux x86_64
    runs-on:

  # }}}

  - id: cervantes
    job: Cervantes
    image: koreader/kocervantes:3.0.0-22.04
    makeflags: PARALLEL_JOBS=5
    update_target: update-txz
    artifacts: koreader-*.tar.xz

  # kindle {{{

  - &KINDLE
    id: kindle
    job: Kindle
    image: koreader/kokindle:3.0.0-22.04
    makeflags: PARALLEL_JOBS=5
    cache_size: 390M
    update_target: update-txz
    artifacts: koreader-*.tar.xz

  - <<: *KINDLE
    id: kindlehf
    job: Kindle HF

  - <<: *KINDLE
    id: kindlepw2
    job: Kindle PW2

  - <<: *KINDLE
    id: kindle-legacy
    job: Kindle Legacy

  # }}}

  # kobo {{{

  - &KOBO
    id: kobo
    job: Kobo
    image: koreader/kokobo:3.0.0-22.04
    makeflags: PARALLEL_JOBS=5
    update_target: update-txz
    artifacts: koreader-*.tar.xz

  - <<: *KOBO
    id: kobov5
    job: Kobo v5

  # }}}

  # pocketbook {{{

  - &POCKETBOOK
    id: pocketbook
    job: PocketBook
    image: koreader/kopb:3.0.0-22.04
    makeflags: PARALLEL_JOBS=5
    update_target: update-txz
    artifacts: koreader-*.tar.xz

  - <<: *POCKETBOOK
    id: pocketbookhf
    job: PocketBook HF

  # }}}

  # remarkable {{{

  - &REMARKABLE
    id: remarkable
    job: Remarkable
    image: koreader/koremarkable:3.0.0-22.04
    makeflags: PARALLEL_JOBS=5
    update_target: update-txz
    artifacts: koreader-*.tar.xz

  - <<: *REMARKABLE
    id: remarkable-aarch64
    job: Remarkable Pro

  # }}}

  - id: sony-prstux
    job: Sony PRSTUX
    image: koreader/kodeb:3.0.0-22.04
    makeflags: PARALLEL_JOBS=5
    update_target: update-txz
    artifacts: koreader-*.tar.xz

# }}}

