name: Build

permissions:
  contents: read

on:
  workflow_call:
    inputs: &INPUTS
      jobs:
        description: 'Run the specified list of jobs'
        default: 'default'
        required: false
        type: string
      all_artifacts:
        description: 'Generate all artifacts'
        default: false
        required: false
        type: boolean
  workflow_dispatch:
    inputs: *INPUTS

defaults:
  run:
    shell: bash

jobs:

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 1
          show-progress: false
          sparse-checkout: |
            .ci
            .github/workflows
      - name: Generate outputs
        id: generate
        run: |
          set -o noglob
          ./.ci/build.prepare.sh ${{ inputs.jobs }} >>"${GITHUB_OUTPUT}"
    outputs:
      emulator: ${{ steps.generate.outputs.emulator }}
      macos: ${{ steps.generate.outputs.macos }}
      platform: ${{ steps.generate.outputs.platform }}

  emulator:
    name: Emulator
    needs: prepare
    if: |
      !cancelled() &&
      needs.prepare.outputs.emulator
    uses: ./.github/workflows/_build.matrix.yml
    with:
      jobs: ${{ needs.prepare.outputs.emulator }}
      fail_fast: true
      all_artifacts: ${{ inputs.all_artifacts }}

  macos:
    name: macOS
    needs: [prepare, emulator]
    if: |
      !cancelled() &&
      needs.prepare.outputs.macos &&
      contains('skipped success', needs.emulator.result)
    uses: ./.github/workflows/_build.matrix.yml
    with:
      jobs: ${{ needs.prepare.outputs.macos }}
      all_artifacts: ${{ inputs.all_artifacts }}

  platform:
    name: Platform
    needs: [prepare, emulator]
    if: |
      !cancelled() &&
      needs.prepare.outputs.platform &&
      contains('skipped success', needs.emulator.result)
    uses: ./.github/workflows/_build.matrix.yml
    with:
      jobs: ${{ needs.prepare.outputs.platform }}
      all_artifacts: ${{ inputs.all_artifacts }}

