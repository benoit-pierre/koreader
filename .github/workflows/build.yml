name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  schedule:
    # Every day at 6 AM (UTC, default branch only).
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Run the specified list of job ids'
        required: false
        type: string
      publish:
        description: 'Publish a release to GitHub'
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash

jobs:

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 1
          show-progress: false
          sparse-checkout: |
            .ci
            .github/workflows
      - name: Generate outputs
        id: generate
        run: |
          set -o noglob
          jobs=(${{
            inputs.jobs && inputs.jobs ||
              (github.event.schedule && 'nightlies' ||
                (github.ref_name == 'master' && 'master' || 'default'))
          }})
          set +o noglob
          >>"${GITHUB_OUTPUT}" ./.ci/build.prepare.sh "${jobs[@]}"
    outputs:
      lint: ${{ steps.generate.outputs.lint }}
      emulator: ${{ steps.generate.outputs.emulator }}
      macos: ${{ steps.generate.outputs.macos }}
      platform: ${{ steps.generate.outputs.platform }}

  lint:
    name: Lint
    needs: prepare
    if: needs.prepare.outputs.lint
    uses: ./.github/workflows/build.lint.yml

  emulator:
    name: Emulator
    needs: [prepare, lint]
    if: |
      !cancelled() &&
      needs.prepare.outputs.emulator &&
      contains('skipped success', needs.lint.result)
    uses: ./.github/workflows/build.matrix.yml
    with:
      jobs: ${{ needs.prepare.outputs.emulator }}
      fail_fast: true

  macos:
    name: macOS
    needs: [prepare, lint, emulator]
    if: |
      !cancelled() &&
      needs.prepare.outputs.macos &&
      contains('skipped success', needs.lint.result) &&
      contains('skipped success', needs.emulator.result)
    uses: ./.github/workflows/build.matrix.yml
    with:
      jobs: ${{ needs.prepare.outputs.macos }}

  platform:
    name: Platform
    needs: [prepare, lint, emulator]
    if: |
      !cancelled() &&
      needs.prepare.outputs.platform &&
      contains('skipped success', needs.lint.result) &&
      contains('skipped success', needs.emulator.result)
    uses: ./.github/workflows/build.matrix.yml
    with:
      jobs: ${{ needs.prepare.outputs.platform }}

  release:
    name: Release
    needs: [emulator, macos, platform]
    if: |
      inputs.publish && !cancelled() &&
      contains('skipped success', needs.lint.result) &&
      contains('skipped success', needs.emulator.result) &&
      contains('skipped success', needs.macos.result) &&
      contains('skipped success', needs.platform.result)
    permissions:
      contents: write
    uses: ./.github/workflows/build.release.yml

