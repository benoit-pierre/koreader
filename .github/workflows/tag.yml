name: Tag

permissions:
  contents: read

on:
  push:
    tags: *

jobs:

  build:
    name: Build
    if: vars.STABLES_GH_REPO
    uses: ./.github/workflows/_build.yml
    with:
      jobs: release

  release:
    name: Release
    needs: build
    uses: ./.github/workflows/_release.yml
    secrets:
      # Yep, this is required to allow the use of the `docker` environment
      # secret of the same name in the called workflow… Pretty evident,
      # right? ¯\_(ツ)_/¯
      TOKEN: ${{ secrets.STABLES_GH_TOKEN }}
    with:
      repo: vars.STABLES_GH_REPO
      jobs: release
      draft: true
