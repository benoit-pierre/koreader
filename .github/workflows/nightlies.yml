name: Nightlies

permissions:
  # TODO: make it conditional on `vars.ORIGIN_REPO`?
  contents: write

on:
  schedule:
    # Every day at 6 AM (UTC, default branch only).
    # - cron: '0 6 * * *'
    - cron: '0 * * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  
  sync:
    name: Synchronize fork
    if: vars.ORIGIN_REPO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 0
          fetch-tags: true
          filter: tree:0
          show-progress: false
          sparse-checkout:
      - name: Pull
        run: git pull --ff-only --tags ${{ vars.ORIGIN_REPO }} ${{ github.ref }}
      - name: Push
        run: git push --tags

  build:
    name: Build
    needs: sync
    if: |
      !cancelled() &&
      github.ref_type != 'tag' &&
      contains('skipped success', needs.sync.result)
    uses: ./.github/workflows/_build.yml
    with:
      jobs: release

  release:
    name: Release
    needs: build
    uses: ./.github/workflows/_release.yml
    secrets:
      # Yep, this is required to allow the use of the `docker` environment
      # secret of the same name in the called workflow… Pretty evident,
      # right? ¯\_(ツ)_/¯
      TOKEN: ${{ secrets.NIGHTLIES_GH_TOKEN }}
    with:
      repo: vars.NIGHTLIES_GH_REPO
